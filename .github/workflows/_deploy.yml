name: Deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to deploy to
        type: choice
        required: true
        options:
          - production
          - staging
      app_version:
        description: app version
        type: string
        required: true
        default: latest
  workflow_call:
    inputs:
      environment:
        description: The environment to deploy to
        type: string
        default: latest
        required: false
      app_version:
        description: app version
        type: string
        required: false
        default: latest
    secrets:
      SLACK_WEBHOOK:
        description: Slack webhook URL
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.app_version }} on ${{ inputs.environment }}
    runs-on: [self-hosted, deploy-lba]
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Notify new deployment on Slack
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          status: success
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          title: "Déploiement ${{ inputs.app_version }} en ${{ inputs.environment }} initié..."
          context: ${{ inputs.environment }}

      - name: Run playbook
        run: .bin/mna app:deploy ${{ inputs.environment }} --extra-vars "app_version=${{ inputs.app_version }}"
        env:
          ANSIBLE_REMOTE_USER: runner-deploy
          ANSIBLE_SKIP_GALAXY: "true"

      - name: Encrypt logs
        run: .bin/mna app:deploy:log:encrypt
        if: always()

      - name: Upload logs artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ inputs.environment }}
          path: /tmp/deploy.log.gpg

      - name: Add Job summary
        if: always()
        run: echo 'You can get logs using `.bin/mna app:deploy:log:decrypt ${{ github.run_id }} ${{ inputs.environment }}`' >> $GITHUB_STEP_SUMMARY

      - name: Notify failure on Slack
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          status: failure
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          title: "Le déploiement ${{ inputs.app_version }} en ${{ inputs.environment }} a échoué"
          context: ${{ inputs.environment }}
          details: "You can get error logs using `.bin/mna app:deploy:log:decrypt ${{ github.run_id }} ${{ inputs.environment }}`"
          mention: "!channel"

      - name: Notify success on Slack
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          status: success
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          title: "Déploiement ${{ inputs.app_version }} en ${{ inputs.environment }} terminé avec succès"
          context: ${{ inputs.environment }}
