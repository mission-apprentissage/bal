[all:vars]
app_version=latest
product_name=bal
domain_name=bal
repo=mission-apprentissage/bal
#Nginx
modsec_body_limit=2147483648

[production]
bal.production.ssh.mna.internal
[production:vars]
dns_name={{ domain_name }}.apprentissage.beta.gouv.fr
host_name={{ product_name }}-production
env_type=production

[staging]
bal.staging.ssh.mna.internal
[staging:vars]
dns_name={{ domain_name }}-recette.apprentissage.beta.gouv.fr
host_name={{ product_name }}.staging
env_type=staging

[local]
localhost ansible_host=127.0.0.1 ansible_connection=local
[local:vars]
env_type=local
